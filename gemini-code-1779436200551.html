<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 翻滾方塊解謎</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #ecf0f1;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        p { margin: 5px 0; font-size: 14px; color: #bdc3c7; }
        #reset-btn {
            margin-top: 15px;
            padding: 8px 20px;
            font-size: 16px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s;
        }
        #reset-btn:hover { background-color: #c0392b; }
        
        #win-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 204, 113, 0.85);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #win-screen h2 { font-size: 48px; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        #win-screen button {
            padding: 12px 30px;
            font-size: 20px;
            background-color: white;
            color: #27ae60;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        #win-screen button:hover { background-color: #ecf0f1; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>3D 翻滾方塊</h1>
        <p>控制：使用鍵盤 <b>[上] [下] [左] [右]</b> 翻滾方塊</p>
        <p>目標：回到正中心，且<b>箭頭朝向你 (Front) 並指向下方 (Down)</b></p>
        <button id="reset-btn" onclick="resetGame()">重新開始</button>
    </div>

    <div id="win-screen">
        <h2>🎉 恭喜通關！ 🎉</h2>
        <button onclick="resetGame()">再玩一次</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#2c3e50');

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 6, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const boardGroup = new THREE.Group();
        const tileSize = 1;
        const tileGap = 0.05;
        const tileGeometry = new THREE.BoxGeometry(tileSize, 0.1, tileSize);
        const tileMaterial = new THREE.MeshStandardMaterial({ color: '#7f8c8d' });
        const centerTileMaterial = new THREE.MeshStandardMaterial({ color: '#95a5a6' });

        for (let x = 0; x < 3; x++) {
            for (let z = 0; z < 3; z++) {
                const mat = (x === 1 && z === 1) ? centerTileMaterial : tileMaterial;
                const tile = new THREE.Mesh(tileGeometry, mat);
                const posX = (x - 1) * (tileSize + tileGap);
                const posZ = (z - 1) * (tileSize + tileGap);
                tile.position.set(posX, -0.05, posZ);
                tile.receiveShadow = true;
                boardGroup.add(tile);
            }
        }
        scene.add(boardGroup);

        function createArrowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#e67e22'; 
            ctx.fillRect(0, 0, 256, 256);
            
            // 【修改點 1】將箭頭繪製邏輯反轉 180 度，使其在 3D 貼圖時朝向玩家
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(128, 216); // 箭頭尖端朝下
            ctx.lineTo(56, 136);
            ctx.lineTo(96, 136);
            ctx.lineTo(96, 46);
            ctx.lineTo(160, 46);
            ctx.lineTo(160, 136);
            ctx.lineTo(200, 136);
            ctx.closePath();
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const cubeGeometry = new THREE.BoxGeometry(tileSize, tileSize, tileSize);
        const baseMaterial = new THREE.MeshStandardMaterial({ color: '#2980b9' });
        const arrowMaterial = new THREE.MeshStandardMaterial({ map: createArrowTexture() });

        const materials = [
            baseMaterial, baseMaterial, arrowMaterial, // Top (帶有箭頭)
            baseMaterial, baseMaterial, baseMaterial
        ];

        const cube = new THREE.Mesh(cubeGeometry, materials);
        cube.castShadow = true;
        scene.add(cube);

        const edges = new THREE.EdgesGeometry(cubeGeometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
        cube.add(line);

        let cubeGridX = 1; 
        let cubeGridZ = 1; 
        let isAnimating = false;
        
        function resetCubeTransform() {
            cubeGridX = 1;
            cubeGridZ = 1;
            cube.position.set(0, 0.5, 0); 
            cube.quaternion.identity();   
        }
        resetCubeTransform();

        let rollConfig = null;
        const rollDuration = 300; 

        function startRoll(dx, dz) {
            if (isAnimating) return;

            const nextX = cubeGridX + dx;
            const nextZ = cubeGridZ + dz;

            if (nextX < 0 || nextX > 2 || nextZ < 0 || nextZ > 2) return;

            let axis, pivotOffset, angle;
            if (dx === 1) { 
                axis = new THREE.Vector3(0, 0, 1);
                pivotOffset = new THREE.Vector3(0.5, -0.5, 0);
                angle = -Math.PI / 2;
            } else if (dx === -1) { 
                axis = new THREE.Vector3(0, 0, 1);
                pivotOffset = new THREE.Vector3(-0.5, -0.5, 0);
                angle = Math.PI / 2;
            } else if (dz === 1) { 
                axis = new THREE.Vector3(1, 0, 1).set(1, 0, 0);
                pivotOffset = new THREE.Vector3(0, -0.5, 0.5);
                angle = Math.PI / 2;
            } else if (dz === -1) { 
                axis = new THREE.Vector3(1, 0, 0);
                pivotOffset = new THREE.Vector3(0, -0.5, -0.5);
                angle = -Math.PI / 2;
            }

            rollConfig = {
                startX: cubeGridX, startZ: cubeGridZ,
                targetX: nextX, targetZ: nextZ,
                startPos: cube.position.clone(),
                startQuat: cube.quaternion.clone(),
                pivot: cube.position.clone().add(pivotOffset),
                axis: axis,
                targetAngle: angle,
                timeStart: performance.now()
            };
            isAnimating = true;
        }

        function checkWinCondition() {
            if (cubeGridX !== 1 || cubeGridZ !== 1) return;

            const initialTopNormal = new THREE.Vector3(0, 1, 0);   
            // 【修改點 2】箭頭初始朝向改為指向玩家 (+Z)
            const initialArrowDir = new THREE.Vector3(0, 0, 1);    

            const currentNormal = initialTopNormal.clone().applyQuaternion(cube.quaternion).normalize();
            const currentArrowDir = initialArrowDir.clone().applyQuaternion(cube.quaternion).normalize();

            const targetNormal = new THREE.Vector3(0, 0, 1);       
            const targetArrowDir = new THREE.Vector3(0, -1, 0);    

            const epsilon = 0.05;
            if (currentNormal.distanceTo(targetNormal) < epsilon && 
                currentArrowDir.distanceTo(targetArrowDir) < epsilon) {
                document.getElementById('win-screen').style.display = 'flex';
            }
        }

        function animate(time) {
            requestAnimationFrame(animate);

            if (isAnimating && rollConfig) {
                let progress = (time - rollConfig.timeStart) / rollDuration;
                progress = Math.min(progress, 1);
                
                const easeProgress = 0.5 - Math.cos(progress * Math.PI) / 2;
                const currentAngle = rollConfig.targetAngle * easeProgress;

                const offset = rollConfig.startPos.clone().sub(rollConfig.pivot);
                offset.applyAxisAngle(rollConfig.axis, currentAngle);
                cube.position.copy(rollConfig.pivot).add(offset);

                const qRotation = new THREE.Quaternion().setFromAxisAngle(rollConfig.axis, currentAngle);
                cube.quaternion.copy(qRotation.multiply(rollConfig.startQuat).normalize());

                if (progress >= 1) {
                    cubeGridX = rollConfig.targetX;
                    cubeGridZ = rollConfig.targetZ;

                    cube.position.x = (cubeGridX - 1) * (tileSize + tileGap);
                    cube.position.z = (cubeGridZ - 1) * (tileSize + tileGap);
                    cube.position.y = 0.5;

                    const exactQuat = new THREE.Quaternion().setFromAxisAngle(rollConfig.axis, rollConfig.targetAngle);
                    cube.quaternion.copy(exactQuat.multiply(rollConfig.startQuat).normalize());

                    isAnimating = false;
                    rollConfig = null;

                    checkWinCondition();
                }
            }
            renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault(); 
            }
            if (e.key === 'ArrowUp') startRoll(0, -1);
            else if (e.key === 'ArrowDown') startRoll(0, 1);
            else if (e.key === 'ArrowLeft') startRoll(-1, 0);
            else if (e.key === 'ArrowRight') startRoll(1, 0);
        });

        window.resetGame = function() {
            resetCubeTransform();
            isAnimating = false;
            rollConfig = null;
            document.getElementById('win-screen').style.display = 'none';
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
